[build]
builder = "nixpacks"

[deploy]
startCommand = "node src/index.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[deploy.volumeMounts]]
mountPath = "/app/wwebjs_auth"
name = "whatsapp-session"

[[deploy.volumeMounts]]
mountPath = "/app/data"
name = "database"

[[deploy.volumeMounts]]
mountPath = "/app/public/uploads"
name = "uploads"
